{% extends "base.html" %}

{% block title %}Task Manager{% endblock %}

{% block nav %}
<nav class="bg-indigo-600 text-white p-4">
    <div class="container mx-auto flex justify-between items-center max-w-xl">
        <h1 class="text-lg font-semibold">Task Manager</h1>
        <div class="space-x-4">
            <a href="/" class="bg-indigo-800 px-4 py-1 rounded-md">Tasks</a>
            <a href="/profile" class="hover:bg-indigo-700 px-4 py-1 rounded-md transition">Profile</a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="container mx-auto p-4 max-w-xl">
    <div class="bg-white p-6 rounded-md shadow-sm mt-6">
        <input type="text" id="title" placeholder="Task Title" class="w-full p-3 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 mb-3">
        <textarea id="description" placeholder="Description (optional)" class="w-full p-3 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 mb-3"></textarea>
        <button onclick="addTask()" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">Add Task</button>
    </div>
    <ul id="task-list" class="mt-6 space-y-4"></ul>
</div>
{% endblock %}
