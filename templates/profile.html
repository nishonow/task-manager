{% extends "base.html" %}

{% block title %}Profile - Task Manager{% endblock %}

{% block nav %}
<nav class="bg-indigo-600 text-white p-4">
    <div class="container mx-auto flex justify-between items-center max-w-xl">
        <h1 class="text-lg font-semibold">Task Manager</h1>
        <div class="space-x-4">
            <a href="/" class="hover:bg-indigo-700 px-4 py-1 rounded-md transition">Tasks</a>
            <a href="/profile" class="bg-indigo-800 px-4 py-1 rounded-md">Profile</a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="container mx-auto p-4 max-w-xl">
    <div class="bg-white p-6 rounded-md shadow-sm mt-6">
        <h2 class="text-xl font-semibold mb-4">Your Profile</h2>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Email</label>
            <input type="email" id="email" placeholder="New Email (optional)" value="{{ current_user.email }}" class="w-full p-3 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-2">Password</label>
            <input type="password" id="password" placeholder="New Password (optional)" class="w-full p-3 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div class="flex space-x-4 justify-center">
            <button onclick="updateProfile()" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">Update Profile</button>
            <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition">Logout</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function updateProfile() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const response = await fetch('/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (response.ok) {
                showToast(data.message, 'success');
            } else {
                showToast(data.error, 'error');
            }
        } catch (error) {
            showToast('Failed to update profile', 'error');
            console.error('Error updating profile:', error);
        }
    }
    
    async function logout() {
        try {
            const response = await fetch('/logout', {
                method: 'POST'
            });
            const data = await response.json();
            if (response.ok) {
                showToast(data.message, 'success');
                setTimeout(() => window.location.href = '/login', 1000);
            } else {
                showToast(data.error, 'error');
            }
        } catch (error) {
            showToast('Failed to logout', 'error');
            console.error('Error logging out:', error);
        }
    }
</script>
{% endblock %}
